name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Unit tests (per-vendor URL shapes, detection, parsing)
        run: cargo test --release
      - name: Conformance suite (unix)
        if: runner.os != 'Windows'
        # Offline checks only; runners ship multiple JDK majors, which is all
        # the suite needs. JOLTA_TEST_NETWORK=1 downloads are exercised locally.
        run: ./test/smoke.sh
      - name: Conformance suite (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/smoke.ps1

  # Bumping `version` in Cargo.toml is the release trigger: once main is
  # green, the new v<version> tag is pushed and the release build dispatched
  # (tags pushed with GITHUB_TOKEN never fire on:push workflows themselves).
  release-tag:
    name: tag release when Cargo.toml version is new
    needs: [test, fresh-bootstrap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Push v<version> tag and dispatch the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          [ "$v" != "v" ] || { echo "cannot read version from Cargo.toml" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "$v already tagged — nothing to release"
            exit 0
          fi
          git tag "$v"
          git push origin "$v"
          gh workflow run release.yml --ref "$v"

  fresh-bootstrap:
    name: fresh machine bootstrap (no JDK anywhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (musl, static)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          cargo build --release --target x86_64-unknown-linux-musl
      - name: First java run installs the latest LTS and sets the default
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/jolta:/usr/local/bin/jolta:ro" \
            ubuntu:24.04 sh -eux -c '
              apt-get update -q >/dev/null && apt-get install -y -q curl ca-certificates >/dev/null
              command -v java && exit 1  # the box must start with no JDK
              export JOLTA_HOME=/root/.jolta
              jolta setup
              export PATH=/root/.jolta/shims:$PATH
              # plain java through the shims, not jolta exec: setup must
              # produce a working java before any JDK is installed
              java -version 2>&1 | tee /tmp/out
              grep -q "latest LTS" /tmp/out
              grep -q "openjdk" /tmp/out
              grep -Eq "^[0-9]+$" /root/.jolta/default
              [ "$(jolta current | head -n1)" ] && jolta current
            '
