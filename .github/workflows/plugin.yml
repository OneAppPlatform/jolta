name: plugin

on:
  push:
    paths: ["plugin/intellij/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/intellij/**", ".github/workflows/plugin.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: plugin/intellij
        run: ./gradlew buildPlugin --no-daemon
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: jolta-intellij
          path: plugin/intellij/build/distributions/*.zip
