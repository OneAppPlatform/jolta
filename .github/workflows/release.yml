name: Release

# Normally dispatched by the release-tag job in ci.yml after a green main
# build; the tag-push trigger still covers manually pushed tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "jolta $GITHUB_REF_NAME" --generate-notes || true

  build:
    needs: create-release
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf jolta-${{ matrix.target }}.tar.gz jolta
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\${{ matrix.target }}\release\jolta.exe -DestinationPath jolta-${{ matrix.target }}.zip
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" jolta-${{ matrix.target }}.* --clobber

  # Keep the winget manifest (OneAppPlatform.Jolta in microsoft/winget-pkgs)
  # current. Runs only when a WINGET_TOKEN secret exists (classic PAT with
  # public_repo scope); without it the job logs a skip and stays green. The
  # very first submission must be made once by hand with `wingetcreate new`
  # (portable zip package) — after that this job keeps every release current.
  winget:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit manifest update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN not set - skipping winget submission"; exit 0 }
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update OneAppPlatform.Jolta --version $v `
            --urls "https://github.com/OneAppPlatform/jolta/releases/download/v$v/jolta-x86_64-pc-windows-msvc.zip" `
            --submit --token $env:WINGET_TOKEN
