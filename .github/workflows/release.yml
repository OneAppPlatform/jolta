name: Release

# Normally dispatched by the release-tag job in ci.yml after a green main
# build; the tag-push trigger still covers manually pushed tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "jolta $GITHUB_REF_NAME" --generate-notes || true

  build:
    needs: create-release
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf jolta-${{ matrix.target }}.tar.gz jolta
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\${{ matrix.target }}\release\jolta.exe -DestinationPath jolta-${{ matrix.target }}.zip
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" jolta-${{ matrix.target }}.* --clobber

  # Keep the Homebrew tap in lockstep with the release: rewrite the formula's
  # version and per-target sha256s. Needs a TAP_TOKEN repo secret (fine-grained
  # PAT with contents:write on OneAppPlatform/homebrew-tap); skipped when absent
  # — the tap then needs a manual bump, which is how it drifted to 9 versions
  # stale once already.
  update-tap:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Update Homebrew formula
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/OneAppPlatform/homebrew-tap" tap
          cd tap
          sed -i "s/^  version \".*\"/  version \"$ver\"/" Formula/jolta.rb
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            curl -fsSL -o asset.tar.gz \
              "https://github.com/OneAppPlatform/jolta/releases/download/${GITHUB_REF_NAME}/jolta-${target}.tar.gz"
            sha=$(sha256sum asset.tar.gz | cut -d' ' -f1)
            # replace the sha256 on the line following this target's url line
            sed -i "/jolta-${target}\.tar\.gz\"/{n;s/sha256 \".*\"/sha256 \"${sha}\"/;}" Formula/jolta.rb
          done
          rm -f asset.tar.gz
          git config user.name "jolta-release-bot"
          git config user.email "noreply@github.com"
          git add Formula/jolta.rb
          git commit -m "jolta ${ver}" && git push || echo "tap already current"
